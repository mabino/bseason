version: '3.8'

services:
  bseason-dev:
    container_name: bseason-dev
    build:
      context: .
      target: development
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=development
      - PORT=3030
    volumes:
      - .:/app
      - /app/node_modules # prevent local node_modules from overwriting container's node_modules
    restart: unless-stopped
